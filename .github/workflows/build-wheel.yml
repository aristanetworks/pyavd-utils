---
name: "Build pyavd-utils wheels for a specific runner"

"on":
  workflow_call:
    inputs:
      runner:
        description: The runner to use to run the workflow
        required: true
        type: string
      TESTPYPI_VERSION:
        description: "PEP 440 Version string to use for manual push to test pypi"
        type: string

env:
  # Do the same for CIBW to be able to troubleshoot errors from CI
  CIBW_BUILD_VERBOSITY: ${{ secrets.ACTIONS_STEP_DEBUG && 3 || 0 }}
  PY_COLORS: 1 # allows molecule colors to be passed to GitHub Actions
  # rust
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------ #
  # Build cross platform pyavd-utils wheels and upload artifacts
  # ------------------------------------------------------------ #
  pyavd_utils_build_wheels:
    name: Build pyavd-utils wheel on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Update version to ${{ inputs.TESTPYPI_VERSION }}
        if: ${{ inputs.TESTPYPI_VERSION != '' }}
        shell: bash # For our Windows friend
        env:
          TESTPYPI_VERSION: ${{ inputs.TESTPYPI_VERSION }}
        run: |-
          pip install bump-my-version
          bump-my-version replace \
            --regex \
            --search "__version__ = \"[^\n]*\"" \
            --replace "__version__ = \"${TESTPYPI_VERSION}\"" \
            --no-configured-files \
            -v \
            pyavd_utils/__init__.py
      - name: Install cibuildwheel
        # See pyproject.toml for config
        run: |
          pip install --group build_wheel
      - name: Build wheels
        # Not using working-directory because manylinux uses a container
        # and will not copy the parent Cargo.toml and we will be sad
        run: |-
          python -m cibuildwheel --output-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyavd-utils-wheels-${{ inputs.runner }}
          path: dist/*.whl

  pyavd_utils_gen_build_wheels:
    name: Build pyavd-utils-gen wheel on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Update version to ${{ inputs.TESTPYPI_VERSION }}
        if: ${{ inputs.TESTPYPI_VERSION != '' }}
        shell: bash
        env:
          TESTPYPI_VERSION: ${{ inputs.TESTPYPI_VERSION }}
        run: |-
          pip install bump-my-version
          bump-my-version replace \
            --regex \
            --search "__version__ = \"[^\n]*\"" \
            --replace "__version__ = \"${TESTPYPI_VERSION}\"" \
            --no-configured-files \
            -v \
            python/pyavd-utils-gen/pyavd_utils_gen/__init__.py
          bump-my-version replace \
            --regex \
            --search "pyavd-utils==[^\"]*" \
            --replace "pyavd-utils==${TESTPYPI_VERSION}" \
            --no-configured-files \
            -v \
            python/pyavd-utils-gen/pyproject.toml
      - name: Install cibuildwheel
        run: pip install --group build_wheel
      - name: Build wheels
        shell: bash
        run: |-
          python -m cibuildwheel \
            python/pyavd-utils-gen \
            --config-file pyproject.toml \
            --output-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyavd-utils-gen-wheels-${{ inputs.runner }}
          path: dist/*.whl

  # ------------------------------------------- #
  # pyavd-utils test on platforms using wheels
  # ------------------------------------------- #
  pyavd_utils_test_cross_platform:
    name: pyavd-utils ${{ matrix.python }} on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    needs: [pyavd_utils_build_wheels, pyavd_utils_gen_build_wheels]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download ${{ inputs.runner }} wheel(s)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyavd-utils-wheels-${{ inputs.runner }}
          path: dist
      - name: Download pyavd-utils-gen ${{ inputs.runner }} wheel(s)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyavd-utils-gen-wheels-${{ inputs.runner }}
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run pytest against the wheel
        shell: bash
        run: |-
          RUNTIME_WHEEL=$(find dist/ -maxdepth 1 -name "pyavd_utils-*.whl" ! -name "*musllinux*" -print -quit)
          GENERATION_WHEEL=$(find dist/ -maxdepth 1 -name "pyavd_utils_gen-*.whl" ! -name "*musllinux*" -print -quit)
          uv sync --locked --no-default-groups --group pytest --no-install-workspace
          uv pip install "$RUNTIME_WHEEL"
          WORKSPACE=$(pwd)
          PYTHON=$(uv run --no-sync python -c "import sys; print(sys.executable)")
          cd ..
          "$PYTHON" -c "import importlib.util, pyavd_utils.schema_store, pyavd_utils.validation; \
            assert importlib.util.find_spec('pyavd_utils_gen') is None; \
            assert not hasattr(pyavd_utils.schema_store, 'compile_schema_archive')"
          uv pip install "$WORKSPACE/$GENERATION_WHEEL" --python "$PYTHON"
          "$PYTHON" -m pytest "$WORKSPACE/tests"

  pyavd_utils_test_musl_wheels_platform:
    # NOTE: Let's track this: https://github.com/actions/runner/issues/801
    runs-on: ${{ inputs.runner }}
    if: contains(inputs.runner, 'ubuntu')
    needs: [pyavd_utils_build_wheels, pyavd_utils_gen_build_wheels]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"] # Parallel over Python versions

    container:
      image: python:${{ matrix.python }}-alpine
      options: --user root
      volumes:
        - /opt:/opt:rw,rshared
        # checkout v6 - download-artifact v7
        - /opt:/__e/node24:ro,rshared
    steps:
      - name: Allow Linux musl containers on ARM64 runners
        # https://github.com/actions/runner/issues/801#issuecomment-2976165281
        if: contains(inputs.runner, 'arm')
        run: |
          sed -i "/^ID=/s/alpine/NotpineForGHA/" /etc/os-release
          apk add nodejs --update-cache
          mkdir /opt/bin
          ln -s /usr/bin/node /opt/bin/node
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download ${{ inputs.runner }} wheel(s)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyavd-utils-wheels-${{ inputs.runner }}
          path: dist
      - name: Download pyavd-utils-gen ${{ inputs.runner }} wheel(s)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyavd-utils-gen-wheels-${{ inputs.runner }}
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run pytest against the wheel
        shell: sh
        run: |-
          RUNTIME_WHEEL=$(find dist/ -maxdepth 1 -name "pyavd_utils-*.whl" -name "*musllinux*" -print -quit)
          GENERATION_WHEEL=$(find dist/ -maxdepth 1 -name "pyavd_utils_gen-*.whl" -name "*musllinux*" -print -quit)
          uv sync --locked --no-default-groups --group pytest --no-install-workspace
          uv pip install "$RUNTIME_WHEEL"
          WORKSPACE=$(pwd)
          PYTHON=$(uv run --no-sync python -c "import sys; print(sys.executable)")
          cd ..
          "$PYTHON" -c "import importlib.util, pyavd_utils.schema_store, pyavd_utils.validation; \
            assert importlib.util.find_spec('pyavd_utils_gen') is None; \
            assert not hasattr(pyavd_utils.schema_store, 'compile_schema_archive')"
          uv pip install "$WORKSPACE/$GENERATION_WHEEL" --python "$PYTHON"
          "$PYTHON" -m pytest "$WORKSPACE/tests"
