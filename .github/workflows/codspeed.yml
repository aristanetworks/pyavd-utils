---
name: Run CodSpeed benchmarks

"on":
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    name: Rust ${{ matrix.mode }} benchmarks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [simulation, memory]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show
      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked
      - name: Build benchmarks
        run: cargo codspeed build --locked --workspace --all-features --measurement-mode ${{ matrix.mode }}
      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: ${{ matrix.mode }}
          run: cargo codspeed run --workspace --measurement-mode ${{ matrix.mode }}
