---
name: Run CodSpeed benchmarks

"on":
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    name: Benchmark Rust crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Setup Rust and cargo-codspeed
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          bins: cargo-codspeed@5.0.1
          cache-target: release
      - name: Download schema benchmark fixture
        run: >-
          curl --fail --location
          --output rust/test_schema_store/tmp/schemas.json.gz
          https://github.com/aristanetworks/avd/releases/download/v6.1.0/schemas.json.gz
      - name: Build benchmarks for simulation and memory modes
        run: cargo codspeed build --locked --workspace --all-features --measurement-mode simulation,memory
      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation,memory
          run: cargo codspeed run --workspace
