---
name: autofix.ci

"on":
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix:
    # Required in branch protection. Keep this name stable.
    name: Autofix - run pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Needed until we move to prek and get proper support for toolchain profile - preferably per hook.
      - name: Install Rust nightly formatter
        run: rustup toolchain install nightly --component rustfmt --no-self-update

      - name: Run pre-commit autofix pass
        id: pre_commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        continue-on-error: ${{ github.event_name != 'merge_group' }}
        with:
          extra_args: --all-files
        # Allowing cargo installs to be unoptimized for install speed.
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: 0
          CARGO_PROFILE_RELEASE_LTO: false
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 256

      - name: Fail if pre-commit failed without fixes
        if: steps.pre_commit.outcome == 'failure'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "pre-commit failed and did not produce changes for autofix.ci to commit."
            exit 1
          fi

      - name: Commit back any git diff
        if: github.event_name != 'merge_group'
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
