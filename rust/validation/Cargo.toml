[package]
name = "validation"
version.workspace = true
edition = "2024"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
avdschema = { path = "../avdschema", default-features = false }
derive_more = { workspace = true, features = ["display", "from"] }
log = { workspace = true }
schema-data = { path = "../schema-data" }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = [
    "arbitrary_precision", # To support very big numbers
    "preserve_order",
] }
yaml-parser = { path = "../yaml-parser", default-features = false, features = ["schema-data"] }

[features]
default = ["gzip", "regex-perf", "yaml"]
gzip = ["avdschema/gzip"]
regex-perf = ["avdschema/regex-perf"]
yaml = ["avdschema/yaml"]

[dev-dependencies]
avdschema = { path = "../avdschema", features = ["dump_load_files"] }
criterion = { workspace = true }
test_schema_store = { path = "../test_schema_store" }
ordermap = { workspace = true, features = ["serde"] }

[lib]
crate-type = ["cdylib", "lib"]

[[bench]]
name = "performance"
harness = false

[[bench]]
name = "patterns"
harness = false
