[package]
name = "schema-merge"
version.workspace = true
edition = "2024"
license.workspace = true

[lints]
workspace = true

[dependencies]
avdschema = { path = "../avdschema", default-features = false }
serde_json = { workspace = true, features = ["arbitrary_precision", "preserve_order"] }
yaml-parser = { path = "../yaml-parser", default-features = false }

[dev-dependencies]
criterion = "=0.8.2"
validation = { path = "../validation", default-features = false }
yaml-parser = { path = "../yaml-parser", features = ["serde"] }

[[bench]]
name = "merge"
harness = false
