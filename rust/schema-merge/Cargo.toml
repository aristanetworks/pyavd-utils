[package]
name = "schema-merge"
version.workspace = true
edition = "2024"
license.workspace = true

[lints]
workspace = true

[dependencies]
avdschema = { path = "../avdschema", default-features = false }
schema-data = { path = "../schema-data" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision", "preserve_order"] }
validation = { path = "../validation", default-features = false }
yaml-parser = { path = "../yaml-parser", default-features = false, features = ["serde"] }

[dev-dependencies]
criterion = "=0.8.2"
yaml_serde = { workspace = true }

[[bench]]
name = "merge"
harness = false
