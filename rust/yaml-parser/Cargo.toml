[package]
name = "yaml-parser"
version.workspace = true
edition = "2024"
license.workspace = true
description = "A YAML 1.2 parser with error recovery, span tracking, and multiple error collection"
readme = "README.md"

[dependencies]
schema-data = { path = "../schema-data", optional = true }
derive_more = { workspace = true, features = ["display"] }
serde = { workspace = true, optional = true }

[dev-dependencies]
avdschema = { path = "../avdschema" }
criterion = "=0.8.2" # Used for benchmarking
saphyr = "=0.2.2"   # Used for benchmarking
yaml_serde = { workspace = true } # Reference backend for compatibility tests and benchmarks

[features]
default = []
# Optional storage-neutral data views for schema navigation and validation.
schema-data = ["dep:schema-data"]
serde = ["dep:serde"]

[[bench]]
name = "parser_bench"
harness = false

[lints]
workspace = true
